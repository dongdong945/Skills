interface:
  display_name: "Figma 与 SwiftUI 视觉复查"
  short_description: "按机型筛选 Figma 对比，Duo 同时展示三姿态，默认 iPhone 12"
  default_prompt: "使用 $review-figma-swiftui 对指定模块或整个 App 做视觉复查，保留已有模块、语言及设备证据，累积更新 output/ui-review。网页固定显示 Figma，默认 iPhone 12；选择唯一的 iPhone Duo 设备选项时并排显示外屏、半折叠和展开，分别保留真实截图或明确缺口，完成授权修正和复验。"
