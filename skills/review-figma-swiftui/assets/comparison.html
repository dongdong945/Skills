<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>@@TITLE@@</title>
<style>
:root{color-scheme:light;--ink:#20262c;--muted:#67717a;--line:#dfe5e8;--nav-offset:190px}
*{box-sizing:border-box}body{margin:0;background:#f3f5f6;color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;overflow-anchor:none}
a{color:#375f7c}button,input,select{font:inherit}button,select,summary{cursor:pointer}button,input,select{border:1px solid #d1dbe0;border-radius:6px;padding:7px 10px;background:white;color:var(--ink)}button:focus-visible,a:focus-visible{outline:2px solid #3874b0;outline-offset:3px}
.wrap{max-width:1600px;margin:auto;padding:0 24px}header{background:white;border-bottom:1px solid var(--line);padding:30px 0 24px}h1{font-size:28px;line-height:1.3;margin:8px 0 12px}.scope,.meta,.note,figcaption,small{color:var(--muted)}.metrics{font-weight:600}details{font-size:12px;max-width:1100px}details ul{padding-left:20px}
nav{position:sticky;top:0;z-index:5;background:#fffefb;border-bottom:1px solid var(--line);box-shadow:0 3px 10px #18222c08}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}.controls input[type=search]{width:210px}select{max-width:260px}.check{font-size:12px;display:flex;align-items:center;gap:4px}#count{margin-left:auto;font-size:12px;color:var(--muted)}
.matrix-scroll{overflow-x:auto}.columns{display:grid;grid-template-columns:repeat(var(--columns),minmax(240px,1fr));gap:18px}.column-headings{padding-bottom:10px}small{display:block;font-size:11px}.page{margin:28px 0;padding:20px;background:white;border:1px solid var(--line);border-radius:10px;scroll-margin-top:var(--nav-offset);overflow-x:auto}.row-title{display:flex;gap:12px;align-items:center;flex-wrap:wrap}h2{font-size:17px;margin:0}.anchor{color:inherit;text-decoration:none}.anchor:hover{text-decoration:underline}.row-title>a{font-size:12px}.status{font-size:11px;padding:3px 8px;border-radius:12px;background:#eef1f3}.issue,.blocked{background:#fcebe8;color:#9c3b2e}.fixed{background:#fff1d9;color:#946008}.verified{background:#e7f4ed;color:#286747}.meta,.note{font-size:12px;margin:9px 0}.note{margin-bottom:16px}code{font-size:11px}
figure{margin:0;min-width:0}.image-scroll{max-height:var(--view-height);overflow:auto;border:1px solid var(--line);border-radius:6px;background:#eff2f4;scrollbar-width:thin}.image-button{display:block;width:min(100%,var(--logical-width));padding:0;border:0;border-radius:0;margin:auto;background:transparent;cursor:zoom-in}.image-button img{display:block;width:100%;height:auto}figcaption{font-size:10px;text-align:center;padding-top:7px;overflow-wrap:anywhere}.missing{min-height:350px;display:grid;place-items:center;padding:24px;border:1px dashed #c4cfd5;color:var(--muted);text-align:center;border-radius:6px;background:#f8f9fa}.full-images .image-scroll{max-height:none}
[hidden]{display:none!important}#empty{text-align:center;padding:60px;color:var(--muted)}footer{padding:25px 0;color:var(--muted);font-size:12px}dialog{width:min(96vw,1280px);max-height:94vh;border:0;border-radius:10px;padding:0;background:#eef2f4;box-shadow:0 24px 90px #0006}dialog::backdrop{background:#1b2635d9}.dialog-head{position:sticky;top:0;background:white;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 18px;font-size:12px}#large{display:block;max-width:100%;height:auto;margin:auto}.dialog-actions{display:flex;gap:12px;align-items:center}
@media(max-width:800px){.wrap{padding-left:14px;padding-right:14px}.page{padding:14px}.columns{gap:12px}#count{margin-left:0}h1{font-size:23px}.controls select{max-width:215px}}@media print{nav{position:static}.controls,dialog{display:none}.page{break-inside:avoid}.image-scroll{max-height:none}}
</style>
</head>
<body style="--columns:@@COLUMN_COUNT@@">
<header><div class="wrap"><small>DESIGN / IMPLEMENTATION REVIEW</small><h1>@@TITLE@@</h1><p class="scope">复查范围：@@SCOPE@@</p><p class="metrics">@@COUNTS@@</p><p class="meta">报告版本：<code>@@REVISION@@</code></p><details><summary>证据来源与验证边界</summary><ul>@@BOUNDARIES@@</ul></details></div></header>
<nav><div class="wrap controls">
<input id="search" type="search" placeholder="搜索模块、页面、状态或 key" aria-label="搜索页面">
<select id="group" aria-label="筛选模块"><option value="">全部模块</option>@@GROUPS@@</select>
<select id="status" aria-label="筛选复查状态"><option value="">全部复查状态</option>@@STATUSES@@</select>
<select id="jump" aria-label="定位页面"><option value="">选择页面…</option>@@JUMPS@@</select><button id="go" type="button">跳转</button>
<label class="check"><input id="full" type="checkbox">展开完整图片</label><button id="reset" type="button">清除筛选</button><a id="module-link">当前模块链接</a><span id="count" aria-live="polite"></span>
</div><div class="matrix-scroll"><div class="wrap columns column-headings">@@COLUMNS@@</div></div></nav>
<main class="wrap">@@ROWS@@<p id="empty" hidden>没有匹配的页面</p><footer>每行是一种页面状态；发现问题、修复与视觉复验分别记录。点击图片放大，页面标题可作为稳定定位链接。</footer></main>
<dialog id="zoom" aria-label="图片放大"><div class="dialog-head"><span id="caption"></span><div class="dialog-actions"><a id="original" target="_blank" rel="noreferrer">查看原图</a><button id="close" type="button">关闭 / Esc</button></div></div><img id="large" alt="放大查看"></dialog>
<script>
const pages=[...document.querySelectorAll('.page')],search=document.querySelector('#search'),group=document.querySelector('#group'),status=document.querySelector('#status'),jump=document.querySelector('#jump'),full=document.querySelector('#full');
function updateURL(hash){const url=new URL(location.href);if(group.value)url.searchParams.set('module',group.value);else url.searchParams.delete('module');if(hash!==undefined)url.hash=hash;document.querySelector('#module-link').href=url.href;try{history.replaceState(null,'',url.href)}catch(error){/* 本地 file 页面仍保留可复制的链接。 */}}
function filter(){let visible=0;const query=search.value.trim().toLowerCase();for(const page of pages){page.hidden=Boolean((query&&!page.dataset.search.toLowerCase().includes(query))||(group.value&&page.dataset.group!==group.value)||(status.value&&page.dataset.status!==status.value));if(!page.hidden)visible++}for(const option of jump.options){option.hidden=Boolean(option.value&&group.value&&option.dataset.group!==group.value)}if(jump.selectedOptions[0]?.hidden)jump.value='';document.querySelector('#count').textContent=visible+' / '+pages.length+' 个状态';document.querySelector('#empty').hidden=visible!==0}
function clearFilters(){search.value='';group.value='';status.value='';filter();updateURL('')}
function locate(id){const target=document.getElementById(id);if(!target)return;search.value='';status.value='';if(group.value&&group.value!==target.dataset.group)group.value=target.dataset.group;filter();jump.value=id;updateURL(id);requestAnimationFrame(()=>requestAnimationFrame(()=>target.scrollIntoView({behavior:'instant',block:'start'})))}
search.addEventListener('input',filter);group.addEventListener('change',()=>{filter();updateURL('')});status.addEventListener('change',filter);jump.addEventListener('change',()=>locate(jump.value));document.querySelector('#go').addEventListener('click',()=>locate(jump.value));document.querySelector('#reset').addEventListener('click',clearFilters);full.addEventListener('change',()=>document.body.classList.toggle('full-images',full.checked));
const zoom=document.querySelector('#zoom'),large=document.querySelector('#large');document.querySelectorAll('.image-button').forEach(button=>button.addEventListener('click',()=>{const image=button.querySelector('img');large.src=image.src;large.alt=image.alt;document.querySelector('#caption').textContent=image.alt;document.querySelector('#original').href=image.src;zoom.showModal()}));document.querySelector('#close').addEventListener('click',()=>zoom.close());zoom.addEventListener('click',event=>{if(event.target===zoom)zoom.close()});
const navigation=document.querySelector('nav');new ResizeObserver(()=>document.documentElement.style.setProperty('--nav-offset',Math.ceil(navigation.getBoundingClientRect().height+16)+'px')).observe(navigation);group.value=new URL(location.href).searchParams.get('module')||'';filter();document.body.classList.toggle('full-images',full.checked);if(location.hash)locate(decodeURIComponent(location.hash.slice(1)));else updateURL();
</script>
</body>
</html>
