interface:
  display_name: "Figma Implement Design"
  short_description: "Build adaptive Figma UI with real assets and device Previews"
  icon_small: "./assets/figma-small.svg"
  icon_large: "./assets/figma.png"
  default_prompt: "Use $figma-implement-design to implement this Figma design with Mock data and real assets, validate the requested device matrix, and save named Preview snapshots."

dependencies:
  tools:
    - type: "mcp"
      value: "figma"
      description: "Figma MCP server"
      transport: "streamable_http"
      url: "https://mcp.figma.com/mcp"
